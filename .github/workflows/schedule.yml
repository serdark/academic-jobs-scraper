name: Academic Jobs Scraper

on:
  schedule:
    # İLAN.GOV: Hafta içi TSİ 07:00 - 11:30 arası her yarım saatte bir
    - cron: "11,41 4-8 * * 1-5"
    # İLAN.GOV: Hafta içi TSİ 12:00 - 18:00 arası 2 saatte bir
    - cron: "11 9,11,13,15 * * 1-5"
    # İLAN.GOV: Hafta sonu TSİ 09:00 ve 21:00'da (12 saatte bir)
    - cron: "11 6,18 * * 0,6"
    # AYDIN ÜNİVERSİTESİ: 29 Eylül TSİ 08:00'dan itibaren her 15 dakikada bir!
    - cron: "11,26,41,56 5-23 29 9 *"
  workflow_dispatch:

concurrency:
  group: scraper-group

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install selenium requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add seen_jobs.json seen_aydin.json || true
          git diff --staged --quiet || git commit -m "Update seen jobs"
          git pull --rebase
          git push
