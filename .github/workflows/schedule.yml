name: Academic Jobs Scraper

on:
  schedule:
    # Hafta içi standart ilan kontrolü (TSİ)
    - cron: "0 0,4,5,6,7,8,9,10,12,14,16,18,21 * * 1-5"
    # Hafta sonu standart ilan kontrolü (TSİ)
    - cron: "0 0,4,8,12,16,20 * * 0,6"
    # YEDİTEPE: Sadece 18 Eylül Cuma, TSİ 08:00 - 23:59 arası her 30 dakikada bir!
    - cron: "0,30 5-20 18 9 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install selenium requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add seen_jobs.json seen_yeditepe.json || true
          git commit -m "Update seen jobs" || true
          git push || true
