name: Academic Jobs Scraper

on:
  schedule:
    # İLAN.GOV - Hafta içi (TSİ 07, 08, 09, 10, 11, 12, 14, 17, 20, 23)
    - cron: "11 4,5,6,7,8,9,11,14,17,20 * * 1-5"
    # İLAN.GOV - Hafta sonu (TSİ 09:00, 13:00, 18:00)
    - cron: "11 6,10,15 * * 0,6"
    # NİŞANTAŞI İKİ LİNK - 22 Eylül Salı TSİ 08:00'dan itibaren her 15 dakikada bir!
    - cron: "11,26,41,56 5-23 22 9 *"
  workflow_dispatch:

# Çift mesajı önleyen altın kilit:
concurrency:
  group: scraper-group

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install selenium requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add seen_jobs.json seen_nisantasi.json || true
          git diff --staged --quiet || git commit -m "Update seen jobs"
          git pull --rebase
          git push
