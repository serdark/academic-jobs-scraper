name: Academic Jobs Scraper

on:
  schedule:
    # Hafta içi (Pzt-Cuma) sabah 07:00-13:00 arası her saat, diğer saatler aralıklı kontrol (TSİ)
    - cron: "0 0,4,5,6,7,8,9,10,12,14,16,18,21 * * 1-5"
    # Hafta sonu (Cmt-Pazar) her 4 saatte bir kontrol (TSİ)
    - cron: "0 0,4,8,12,16,18,20 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install selenium requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add seen_jobs.json || true
          git commit -m "Update seen jobs" || true
          git push || true
